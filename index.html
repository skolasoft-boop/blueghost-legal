<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlueGhost</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0e1a;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .logo { font-size: 48px; font-weight: 800; letter-spacing: 4px; margin-bottom: 16px; }
    .logo span:first-child {
      background: linear-gradient(135deg, #4fc3f7, #7c4dff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .logo span:last-child { color: #e0e0e0; font-weight: 300; }
    .tagline { font-size: 18px; color: #90caf9; margin-bottom: 48px; }
    .links { display: flex; flex-direction: column; gap: 12px; }
    .links a {
      color: #b0b8c8;
      text-decoration: none;
      padding: 12px 32px;
      border: 1px solid #1e2a4a;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .links a:hover {
      border-color: #4fc3f7;
      color: #4fc3f7;
      background: rgba(79, 195, 247, 0.05);
    }
  </style>
</head>
<body>
  <div class="logo"><span>BLUE</span><span>GHOST</span></div>
  <p class="tagline">Yakınındaki Kişileri Keşfet</p>
  <div class="links">
    <a href="privacy-policy.html">Gizlilik Politikası</a>
    <a href="terms-of-service.html">Kullanım Koşulları</a>
    <a href="kvkk.html">KVKK Aydınlatma Metni</a>
    <a href="support.html">Destek</a>
  </div>
</body>
</html>
